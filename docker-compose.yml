services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: alzguardian-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: alzguardian
      POSTGRES_USER: alzguardian
      POSTGRES_PASSWORD: alzguardian_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: